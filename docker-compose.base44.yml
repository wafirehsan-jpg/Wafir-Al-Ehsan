services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["node", "server/index.js"]
    environment:
      - PORT=5000
      - NODE_ENV=development
    env_file:
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    environment:
      - VITE_PROXY_TARGET=http://backend:5000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure

volumes:
  node_modules:
